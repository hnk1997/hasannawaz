<style>
  /* Same cross-page transition the case studies use, so arriving at the gate
     and leaving it match the rest of the site rather than hard-cutting. */
  @view-transition{ navigation: auto; }
  ::view-transition-old(root){ animation: gate-out .5s cubic-bezier(.4,0,.2,1) both; }
  ::view-transition-new(root){ animation: gate-in .5s cubic-bezier(.4,0,.2,1) both; }
  @keyframes gate-out{ to{ opacity:0; transform:scale(.985); } }
  @keyframes gate-in{ from{ opacity:0; transform:scale(1.015); } }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#fff;color:#000;
    font-family:"Inter","Inter Placeholder",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
    transition:opacity .32s cubic-bezier(.4,0,.2,1)}
  .gate.is-leaving{opacity:0}
  .gate__inner{width:100%;max-width:400px;text-align:center;
    animation:gate-rise .55s cubic-bezier(.16,1,.3,1) both}
  @keyframes gate-rise{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

  .gate__title{font-family:"Inter Tight",sans-serif;font-size:32px;font-weight:800;
    line-height:1.15;margin:0 0 8px;color:#000}
  .gate__sub{font-size:18px;font-weight:500;color:rgb(96,93,100);margin:0 0 28px}

  .gate__field{position:relative;margin:0 0 12px}
  /* reference: 1px #ccc, 8px radius, border-color .3s, focus lands on #404040 */
  .gate__input{width:100%;height:48px;border:1px solid #ccc;border-radius:8px;background:#fff;
    font:inherit;font-size:16px;font-weight:500;color:#000;padding:12px 56px 12px 12px;
    outline:none;appearance:none;transition:border-color .3s}
  .gate__input:focus{border-color:#404040}
  .gate__input.is-error{border-color:#d92d20}
  .gate__eye{position:absolute;top:50%;right:12px;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:center;
    border:0;background:none;cursor:pointer;color:#000;padding:0}
  .gate__eye:hover{opacity:.6}

  .gate__btn{width:100%;height:46px;border:0;border-radius:8px;background:#000;color:#fff;
    font-family:"Inter",sans-serif;font-size:16px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background-color .3s}
  .gate__btn:hover{background-color:#333}
  .gate__btn[disabled]{background-color:#555;cursor:default}

  .gate__err{min-height:20px;margin:10px 0 0;font-size:14px;color:#d92d20;
    opacity:0;transition:opacity .3s}
  .gate__err.is-on{opacity:1}

  .gate__back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;
    font-size:14px;color:#000;text-decoration:none;transition:opacity .3s}
  .gate__back:hover{opacity:.6}
  .gate svg{display:block}
  @media (prefers-reduced-motion:reduce){
    .gate,.gate *{transition:none!important;animation:none!important}
    ::view-transition-old(root),::view-transition-new(root){animation:none}
  }
</style>

<div class="gate">
  <main class="gate__inner">
    <h1 class="gate__title">PRIVATE CONTENT</h1>
    <p class="gate__sub">Enter passcode to continue</p>

    <form id="gateForm" autocomplete="off">
      <div class="gate__field">
        <input class="gate__input" id="pw" name="password" type="password"
               aria-label="Passcode" autocomplete="current-password" autofocus>
        <button class="gate__eye" type="button" id="eye" aria-label="Show passcode">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button class="gate__btn" id="unlock" type="submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span id="unlockLabel">Unlock</span>
      </button>
      <p class="gate__err" id="err" role="alert"></p>
    </form>

    <a class="gate__back" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>
      </svg>
      Return to Projects
    </a>
  </main>
</div>

<script>
(function(){
  "use strict";
  // The case study is stored here as AES-256-GCM ciphertext, not as hidden
  // markup -- without the passcode there is nothing in this file to read.
  var PAYLOAD = window.__CS_PAYLOAD__;
  var KEY_CACHE = "hn-ds-unlocked";

  var form = document.getElementById("gateForm");
  var pw = document.getElementById("pw");
  var err = document.getElementById("err");
  var btn = document.getElementById("unlock");
  var label = document.getElementById("unlockLabel");
  var eye = document.getElementById("eye");

  eye.addEventListener("click", function(){
    var showing = pw.type === "text";
    pw.type = showing ? "password" : "text";
    eye.setAttribute("aria-label", showing ? "Show passcode" : "Hide passcode");
    pw.focus();
  });

  function b2u(b64){
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
    return out;
  }

  function fail(msg){
    err.textContent = msg;
    err.classList.add("is-on");
    pw.classList.add("is-error");
    btn.disabled = false;
    label.textContent = "Unlock";
  }

  function render(html){
    try { sessionStorage.setItem(KEY_CACHE, "1"); } catch(e){}
    // Ease the gate out first so the unlock reads as a transition rather
    // than a hard document swap.
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var swap = function(){ document.open(); document.write(html); document.close(); };
    if (reduce) return swap();
    document.querySelector(".gate").classList.add("is-leaving");
    setTimeout(swap, 320);
  }

  async function unlock(pass, quiet){
    if (!pass) { if(!quiet) fail("Enter the passcode."); return false; }
    if (!(window.crypto && crypto.subtle)) {
      fail("This browser cannot decrypt the page. Try a modern browser over https.");
      return false;
    }
    btn.disabled = true; label.textContent = "Unlocking…";
    try{
      var enc = new TextEncoder();
      var base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        {name:"PBKDF2", salt:b2u(PAYLOAD.salt), iterations:PAYLOAD.iterations, hash:"SHA-256"},
        base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      var plain = await crypto.subtle.decrypt(
        {name:"AES-GCM", iv:b2u(PAYLOAD.iv)}, key, b2u(PAYLOAD.ct));
      render(new TextDecoder().decode(plain));
      return true;
    } catch(e){
      // AES-GCM authentication failure == wrong passcode
      if (!quiet) fail("That passcode is not right.");
      else { btn.disabled = false; label.textContent = "Unlock"; }
      return false;
    }
  }

  pw.addEventListener("input", function(){
    err.classList.remove("is-on"); pw.classList.remove("is-error");
  });

  form.addEventListener("submit", function(e){ e.preventDefault(); unlock(pw.value, false); });

  // Enter submits from the field itself. The form element already does this
  // natively, but the eye toggle is a button inside that form, so this
  // guarantees the behaviour regardless of which control has focus.
  [pw, eye].forEach(function(el){
    el.addEventListener("keydown", function(e){
      if (e.key === "Enter") { e.preventDefault(); unlock(pw.value, false); }
    });
  });
})();
</script>
</body>
